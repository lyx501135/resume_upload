name: resume_upload_sdk
description: A Flutter SDK for resumable file uploads with chunk-based upload and automatic resume support. Supports pause, resume, cancel, and progress tracking across all platforms.
version: 1.3.0
homepage: https://github.com/lyx501135/resume_upload
repository: https://github.com/lyx501135/resume_upload
issue_tracker: https://github.com/lyx501135/resume_upload/issues
topics:
  - upload
  - file-upload
  - resumable
  - chunk-upload

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

# Lower bounds, not bare names: pub publish flags unconstrained dependencies.
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.8
  path: ^1.9.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  build_runner: ^2.17.1

flutter:

