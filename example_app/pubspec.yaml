name: resume_upload_example
description: A sample Flutter app demonstrating the Resume Upload SDK.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  resume_upload_sdk:
    path: ../flutter_sdk/resume_upload_sdk
  file_picker:
  permission_handler:
  cupertino_icons:
  url_launcher:
  material_ui:
  dio:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  shared_preferences:

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

